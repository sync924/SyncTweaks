<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SyncTweaks Aim Trainer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050509;
    color: white;
    min-height: 100vh;
}

header {
    padding: 22px 7%;
    border-bottom: 1px solid #20202d;
    background: #08080e;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    background: linear-gradient(90deg, #a855f7, #25d9ff);
    -webkit-background-clip: text;
    color: transparent;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 50px 20px;
}

.hero {
    text-align: center;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #a855f7, #25d9ff);
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: #999;
}

.trainer {
    position: relative;
    height: 500px;
    margin-top: 35px;
    background: #0b0b12;
    border: 1px solid #29293a;
    border-radius: 18px;
    overflow: hidden;
}

.target {
    position: absolute;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: radial-gradient(circle, #25d9ff 0%, #8b5cf6 55%, #30145a 100%);
    box-shadow: 0 0 25px #25d9ff66;
    cursor: crosshair;
    display: none;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 35px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.stat {
    text-align: center;
    background: #101019;
    border: 1px solid #29293a;
    border-radius: 12px;
    padding: 15px 25px;
}

.stat span {
    display: block;
    color: #888;
    font-size: 13px;
}

.stat strong {
    display: block;
    margin-top: 5px;
    font-size: 24px;
}

button {
    margin-top: 25px;
    padding: 14px 30px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #8b5cf6, #25d9ff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .85;
}

.back {
    display: inline-block;
    margin-top: 25px;
    color: #aaa;
    text-decoration: none;
}

.back:hover {
    color: white;
}

@media (max-width: 600px) {
    .hero h1 {
        font-size: 36px;
    }

    .trainer {
        height: 400px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">SYNC TWEAKS</div>
</header>

<main class="container">

    <section class="hero">

        <h1>🎯 Aim Trainer</h1>

        <p>
            Practice reaction speed and target accuracy.
        </p>

        <div class="trainer" id="trainer">

            <div class="target" id="target"></div>

        </div>

        <div class="stats">

            <div class="stat">
                <span>Hits</span>
                <strong id="hits">0</strong>
            </div>

            <div class="stat">
                <span>Misses</span>
                <strong id="misses">0</strong>
            </div>

            <div class="stat">
                <span>Accuracy</span>
                <strong id="accuracy">0%</strong>
            </div>

            <div class="stat">
                <span>Best Reaction</span>
                <strong id="best">--</strong>
            </div>

        </div>

        <button id="start">
            START TRAINING
        </button>

        <br>

        <a class="back" href="index.html">
            ← Back to SyncTweaks
        </a>

    </section>

</main>

<script>

const trainer = document.getElementById("trainer");
const target = document.getElementById("target");

const hitsText = document.getElementById("hits");
const missesText = document.getElementById("misses");
const accuracyText = document.getElementById("accuracy");
const bestText = document.getElementById("best");

const startButton = document.getElementById("start");

let hits = 0;
let misses = 0;
let best = null;
let startTime = 0;
let running = false;

function spawnTarget() {

    const maxX = trainer.clientWidth - target.offsetWidth;
    const maxY = trainer.clientHeight - target.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    target.style.left = x + "px";
    target.style.top = y + "px";
    target.style.display = "block";

    startTime = performance.now();
}

function updateStats() {

    const total = hits + misses;

    const accuracy =
        total === 0
        ? 0
        : Math.round((hits / total) * 100);

    hitsText.textContent = hits;
    missesText.textContent = misses;
    accuracyText.textContent = accuracy + "%";

    bestText.textContent =
        best === null ? "--" : best + " ms";
}

target.addEventListener("click", function(event) {

    event.stopPropagation();

    if (!running) return;

    const reaction =
        Math.round(performance.now() - startTime);

    hits++;

    if (best === null || reaction < best) {
        best = reaction;
    }

    updateStats();
    spawnTarget();
});

trainer.addEventListener("click", function() {

    if (!running) return;

    misses++;
    updateStats();

});

startButton.addEventListener("click", function() {

    hits = 0;
    misses = 0;
    best = null;
    running = true;

    startButton.textContent = "RESET TRAINING";

    updateStats();
    spawnTarget();

});

</script>

</body>
</html>
